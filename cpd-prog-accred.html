const rows = data.split("\n").map(line => line.split("|"));
const thead = document.querySelector("#thead");
const tbody = document.querySelector("#tbody");
const search = document.querySelector("#search");
const count = document.querySelector("#count");

const headingRow = document.createElement("tr");
headers.forEach(text => {
  const th = document.createElement("th");
  th.textContent = text;
  headingRow.appendChild(th);
});
thead.appendChild(headingRow);

const filterRow = document.createElement("tr");
filterRow.className = "filters";

headers.forEach((header, column) => {
  const th = document.createElement("th");
  const select = document.createElement("select");
  select.className = "filter";
  select.setAttribute("aria-label", `Filter by ${header}`);

  const allOption = document.createElement("option");
  allOption.value = "";
  allOption.textContent = "All";
  select.appendChild(allOption);

  const values = [...new Set(rows.map(row => row[column] || ""))]
    .sort((a, b) => a.localeCompare(b));

  values.forEach(value => {
    const option = document.createElement("option");
    option.value = value === "" ? "__blank__" : value;
    option.textContent = value === "" ? "(Blank)" : value;
    select.appendChild(option);
  });

  select.addEventListener("change", filterTable);
  th.appendChild(select);
  filterRow.appendChild(th);
});
thead.appendChild(filterRow);

rows.forEach(row => {
  const tr = document.createElement("tr");
  row.forEach((value, column) => {
    const td = document.createElement("td");
    if (column === 8) {
      const badge = document.createElement("span");
      badge.className = "badge " + (value === "Pending" ? "pending" : "accredited");
      badge.textContent = value;
      td.appendChild(badge);
    } else {
      td.textContent = value;
    }
    tr.appendChild(td);
  });
  tbody.appendChild(tr);
});

function filterTable() {
  const query = search.value.toLocaleLowerCase();
  const filters = [...document.querySelectorAll(".filter")];
  let visible = 0;

  [...tbody.rows].forEach((tr, rowIndex) => {
    const row = rows[rowIndex];
    const matchesSearch = row.join(" ").toLocaleLowerCase().includes(query);
    const matchesFilters = filters.every((select, column) => {
      if (!select.value) return true;
      if (select.value === "__blank__") return row[column] === "";
      return row[column] === select.value;
    });

    tr.hidden = !(matchesSearch && matchesFilters);
    if (!tr.hidden) visible++;
  });

  count.textContent = `Showing ${visible} of ${rows.length} activities`;
}

search.addEventListener("input", filterTable);
filterTable();
