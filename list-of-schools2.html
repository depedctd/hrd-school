const columns = raw.trim().split("\n")[0].split("|");
const records = raw.trim().split("\n").slice(1)
  .map(line => line.split("|"));

let sortColumn = -1;
let sortAscending = true;

const head = document.getElementById("head");
const filterRow = document.getElementById("filters");
const body = document.getElementById("body");
const search = document.getElementById("search");

columns.forEach((name, index) => {
  const th = document.createElement("th");
  const button = document.createElement("button");
  button.textContent = name + " ↕";
  button.addEventListener("click", () => {
    sortAscending = sortColumn === index ? !sortAscending : true;
    sortColumn = index;
    render();
  });
  th.appendChild(button);
  head.appendChild(th);

  const filterTh = document.createElement("th");
  const input = document.createElement("input");
  input.placeholder = "Filter…";
  input.setAttribute("aria-label", `Filter ${name}`);
  input.addEventListener("input", render);
  filterTh.appendChild(input);
  filterRow.appendChild(filterTh);
});

function render() {
  const filters = [...filterRow.querySelectorAll("input")]
    .map(input => input.value.trim().toLowerCase());
  const query = search.value.trim().toLowerCase();

  let visible = records.filter(row =>
    row.every((value, i) => value.toLowerCase().includes(filters[i])) &&
    (!query || row.some(value => value.toLowerCase().includes(query)))
  );

  if (sortColumn >= 0) {
    visible.sort((a, b) => {
      const comparison = a[sortColumn].localeCompare(b[sortColumn], undefined, {
        numeric: true, sensitivity: "base"
      });
      return sortAscending ? comparison : -comparison;
    });
  }

  body.replaceChildren();
  for (const row of visible) {
    const tr = document.createElement("tr");
    for (const value of row) {
      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }

  document.getElementById("status").textContent =
    `Showing ${visible.length} of ${records.length} schools`;
}

search.addEventListener("input", render);
document.getElementById("clear").addEventListener("click", () => {
  search.value = "";
  filterRow.querySelectorAll("input").forEach(input => input.value = "");
  render();
});
render();
</script>
